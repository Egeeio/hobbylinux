# Hobby Linux Cloud-Init Configuration
users:
  - default
  - name: root

system_info:
  default_user:
    name: hobby
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /usr/bin/fish
    lock_passwd: true
    gecos: Hobby Linux User
    groups: [adm, audio, cdrom, dialout, dip, floppy, plugdev, sudo, video]

preserve_hostname: false

# Sync cloud-injected root SSH keys to hobby user on boot
runcmd:
  - |
    if [ -f /root/.ssh/authorized_keys ]; then
      mkdir -p /home/hobby/.ssh
      cp -f /root/.ssh/authorized_keys /home/hobby/.ssh/authorized_keys
      chown -R hobby:hobby /home/hobby/.ssh
      chmod 700 /home/hobby/.ssh
      chmod 600 /home/hobby/.ssh/authorized_keys
    fi

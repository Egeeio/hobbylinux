version: '3'

tasks:
  run:
    desc: 'Run the live ISO in QEMU (alias for vm:iso)'
    cmds:
      - task: iso

  iso:
    desc: 'Run the live ISO in QEMU (optional: ISO=path/to.iso)'
    cmds:
      - fish scripts/vm-run.fish {{.ISO}}

  cloud:
    desc: 'Run the cloud QCOW2 in QEMU with SSH forwarded on localhost:2222'
    cmds:
      - fish scripts/vm-run-cloud.fish {{.IMAGE}}

  clean:
    desc: 'Delete vm dir'
    cmds:
      - rm -rf vm/

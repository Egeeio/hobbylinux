version: '3'

tasks:
  run:
    desc: 'Boot the local VM disk in QEMU (no ISO attached)'
    cmds:
      - fish scripts/vm-run.fish

  iso:
    desc: 'Boot the live ISO in QEMU (default: latest in build/, optional: ISO=path/to.iso)'
    cmds:
      - fish scripts/vm-run.fish --iso {{.ISO}}

  clean:
    desc: 'Delete vm dir'
    cmds:
      - rm -rf vm/
